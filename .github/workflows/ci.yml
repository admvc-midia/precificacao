# Corre o que ja se corre a mao, em cada push.
#
# Nao ha base de dados aqui de proposito. O motor de custos, as unidades, as
# despesas e a sessao sao funcoes puras e testam-se sem Postgres nenhum; o que
# depende da base verifica-se a mao contra uma base descartavel, e uma ligacao
# a base real num runner publico seria um risco sem ganho.
#
# `DATABASE_URL` e falsa e so existe porque o `prisma generate` exige que a
# variavel declarada no schema esteja definida. Nada se liga a ela.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=precificaragao

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # Independente do motor: confere as mesmas contas em Python, a partir das
      # formulas, sem importar uma linha de TypeScript. Se as duas concordarem,
      # o erro teria de estar nas duas ao mesmo tempo.
      - name: Verificador independente
        run: python3 tools/verify_pricing.py

      - name: Build
        run: npm run build
